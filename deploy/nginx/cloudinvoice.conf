# CloudInvoice, published at cloudinvoice.co.in (apex canonical, www redirects).
#
# Deliberately modelled on the `studio` site file on this host, but with two
# differences that matter:
#
#   * No auth_basic. CloudInvoice is a public product with its own authentication
#     (Better Auth sessions). A password prompt in front of it would break signup.
#   * No X-Robots-Tag noindex. This site WANTS to be indexed; it ships metadata,
#     a sitemap and robots.txt.
#
# What is kept from the studio pattern:
#
#   1. cf-allow.conf   Only Cloudflare may reach the origin. A visitor hitting the
#                      VPS IP directly gets 403, so the proxy cannot be bypassed and
#                      TLS cannot be skipped. This REQUIRES the DNS records to be
#                      PROXIED (orange cloud). With the proxy off (grey cloud), the
#                      origin sees the visitor's own address, which is not in the
#                      allowlist, and every request 403s.
#   2. 127.0.0.1:3002  The container publishes to loopback only. nginx is the sole
#                      route in. Do not change that binding back to 0.0.0.0: doing so
#                      puts the app on the public internet over plain HTTP and lets
#                      anyone skip layer 1.
#
# Install: /etc/nginx/sites-available/cloudinvoice, symlinked into sites-enabled.
# Source of truth for this file is deploy/nginx/cloudinvoice.conf in the app repo.

# ---------------------------------------------------------------------------
# Canonical host. Serves the application.
# ---------------------------------------------------------------------------
server {
    # Deliberately plain `listen 443 ssl`, matching every other site on this host.
    #
    # nginx applies listen protocol options per listening socket, not per server block.
    # Because this file sorts first in sites-enabled, adding `http2` here silently
    # enabled HTTP/2 on the shared 0.0.0.0:443 socket for ghumo, monitor, portainer and
    # studio as well, and logged "protocol options redefined" for each. Cloudflare
    # already negotiates HTTP/2 with the browser, so origin-side HTTP/2 buys nothing
    # here and is not worth changing behaviour for neighbouring sites.
    listen 443 ssl;
    server_name cloudinvoice.co.in;

    # Until a certificate exists for this name, the ghumofiroindia.com one is reused.
    # The name mismatch is invisible to visitors: Cloudflare terminates TLS with its
    # own certificate, and in SSL mode "Full" it does not verify the origin's name.
    # Only Cloudflare ever connects here, because of cf-allow.conf.
    #
    # Once DNS resolves, issue a real certificate and move Cloudflare to
    # "Full (Strict)":
    #   sudo certbot --nginx -d cloudinvoice.co.in -d www.cloudinvoice.co.in
    # then repoint the two lines below at /etc/letsencrypt/live/cloudinvoice.co.in/.
    ssl_certificate     /etc/letsencrypt/live/ghumofiroindia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghumofiroindia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Invoice logo and attachment uploads go through /api/upload.
    client_max_body_size 16M;

    # Belt and braces. Cloudflare adds most of these at the edge, but a request that
    # reaches the origin some other way should still get them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Next.js emits immutable, content-hashed asset filenames. Let Cloudflare and the
    # browser cache them hard; this is the single biggest win for repeat visits.
    location /_next/static/ {
        include /etc/nginx/cf-allow.conf;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Stripe posts here. Delivery still arrives via Cloudflare because the hostname is
    # proxied, so cf-allow.conf correctly applies. What matters in this block is that
    # the raw request body reaches the app unmodified: signature verification hashes
    # the exact bytes, so any buffering or rewriting breaks it.
    location = /api/webhooks/stripe {
        include /etc/nginx/cf-allow.conf;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        # Layer 1: only Cloudflare may connect.
        include /etc/nginx/cf-allow.conf;

        # Layer 2: loopback-bound container.
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # Next.js uses websockets for streaming and RSC payloads in places.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        # Cloudflare's own header carries the real client; $remote_addr is an edge IP.
        # Better Auth rate limiting and audit trails depend on getting this right.
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Without this the app believes it is on HTTP and will not set Secure cookies.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # PDF generation and Stripe round-trips can outrun the default 60s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# www redirects to the apex, so there is a single canonical origin for SEO and
# so session cookies are only ever issued for one host.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name www.cloudinvoice.co.in;

    ssl_certificate     /etc/letsencrypt/live/ghumofiroindia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghumofiroindia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cloudinvoice.co.in$request_uri;
}

# ---------------------------------------------------------------------------
# Plain HTTP exists only to redirect. Session cookies must never cross in clear.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name cloudinvoice.co.in www.cloudinvoice.co.in;

    # Let certbot's HTTP-01 challenge through ahead of the redirect, so issuing a
    # real certificate for these names does not require editing this file.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://cloudinvoice.co.in$request_uri;
    }
}
